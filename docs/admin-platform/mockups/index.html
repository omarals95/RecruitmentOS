<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecruitmentOS admin (mockup)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar"></header>
    <nav class="sidebar" aria-label="Admin navigation"></nav>
    <main class="main" id="main"></main>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <!-- Page order inside each sidebar group follows this list. A missing file is skipped. -->
  <script>
    const PAGE_FILES = [
      "home", "users", "groups", "teams", "company-authority",
      "roles", "permissions", "permission-helper", "organisation",
      "fields", "screens", "workflows",
      "branding", "domain",
      "notifications", "mail",
      "integrations",
      "health", "audit",
    ];
    let loaded = 0;
    PAGE_FILES.forEach((f) => {
      const s = document.createElement("script");
      s.src = "pages/" + f + ".js";
      s.async = false;
      s.onload = s.onerror = () => { if (++loaded === PAGE_FILES.length) Admin.start(); };
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
